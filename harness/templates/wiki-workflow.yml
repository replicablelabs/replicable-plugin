# Managed by replicable-harness: `/replicable-harness:setup` replaces this file
# on upgrade. Runs the deterministic wiki checks; on pull requests it also fails
# when code changed without the wiki pages that describe it.
name: wiki
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # staleness, raw-immutability and --base need history
      - name: Fetch the harness version this repository uses
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".claude/replicable-harness.json"))["harness_version"])')
          git clone --quiet --depth 1 --branch "v$version" {repository}.git "$RUNNER_TEMP/harness"
      - name: wiki check
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then
            python3 "$RUNNER_TEMP/harness/harness/wiki.py" check --base "origin/$BASE"
          else
            python3 "$RUNNER_TEMP/harness/harness/wiki.py" check
          fi
